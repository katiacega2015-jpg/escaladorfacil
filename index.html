<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080D1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Oráculo das 52 Lâminas</title>
<style>
  :root{
    --bg:#080D1A; --panel:#140c28; --line:#3a2a60;
    --gold:#F7D070; --gold-d:#8A6818;
    --ink:#F3ECFF; --ink-dim:#B8AEDC; --red:#FF3A5A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background-color:var(--bg);
    background-image:radial-gradient(#1F1133 1px, transparent 1px);
    background-size:6px 6px;
    color:var(--ink);
    font-family:ui-monospace, "SFMono-Regular", Menlo, "Courier New", monospace;
    overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  }
  #app{
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; flex-direction:column;
  }
  header{text-align:center; padding:16px 56px 8px; position:relative;}
  header h1{margin:0; font-size:15px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); text-shadow:2px 2px 0 #000;}
  header p{margin:6px 0 0; font-size:11px; color:var(--ink-dim);}
  .icon-btn{
    position:absolute; top:calc(12px + env(safe-area-inset-top));
    width:38px; height:38px; font-size:15px; line-height:1;
    background:#1F1133; color:var(--gold); border:2px solid var(--gold);
    box-shadow:3px 3px 0 #000; cursor:pointer; touch-action:manipulation; font-family:inherit;
  }
  .icon-btn.left{left:12px;} .icon-btn.right{right:12px;}
  main{flex:1; display:flex; flex-direction:column; align-items:center; padding:6px 12px 28px;}
  .spreads{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:8px 0 12px; max-width:520px;}
  .pbtn{
    background:#1F1133; color:var(--gold); border:2px solid var(--gold);
    box-shadow:3px 3px 0 #000; border-radius:0;
    font-family:inherit; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    padding:8px 10px; cursor:pointer; touch-action:manipulation;
  }
  .pbtn.active{background:var(--gold); color:#1F1133; font-weight:700;}
  .pbtn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 #000;}
  .pbtn.big{font-size:13px; padding:12px 18px;}
  .spread-desc{font-size:11px; color:var(--ink-dim); text-align:center; max-width:420px; margin:0 0 12px; line-height:1.5;}
  .row-block{width:100%; display:flex; flex-direction:column; align-items:center; margin-bottom:12px;}
  .row-header{font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
  .row-cards{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .slot{display:flex; flex-direction:column; align-items:center; gap:5px; width:92px;}
  .slot-label{font-size:9px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.5px; text-align:center; min-height:22px; line-height:1.2; display:flex; align-items:flex-end;}
  .slot-name{font-size:9px; color:var(--gold); text-align:center; line-height:1.2; min-height:11px;}
  canvas.cv{
    width:90px; height:160px; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;
    box-shadow:3px 3px 0 #000; cursor:pointer; touch-action:manipulation;
  }
  canvas.cv.locked{opacity:.35; cursor:default;}
  .choice-panel{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin:4px 0 14px; padding:12px; max-width:420px;
    background:var(--panel); border:2px dashed var(--gold-d);
  }
  .choice-panel p{margin:0; font-size:11px; color:var(--ink-dim); text-align:center; line-height:1.5;}
  .choice-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .reading-info{width:100%; max-width:520px; display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .card-detail{
    background:var(--panel); border:2px solid var(--line); border-left:6px solid var(--acc, var(--gold));
    box-shadow:3px 3px 0 #000; padding:10px 12px; cursor:pointer;
  }
  .card-detail h3{margin:0 0 4px; font-size:13px; color:var(--gold); display:flex; align-items:center; gap:8px; flex-wrap:wrap; text-transform:uppercase; letter-spacing:.5px;}
  .tagp{font-size:9px; padding:2px 6px; background:#000; color:#fff; border:1px solid #fff;}
  .tagp.esc{color:var(--red); border-color:var(--red);}
  .card-detail .meaning{font-size:12px; color:var(--ink-dim); line-height:1.55; margin:0;}
  .card-detail .suitline{font-size:10px; color:#8a7ab8; margin-top:4px;}
  .hint{font-size:11px; color:var(--ink-dim); text-align:center; margin:12px 0;}
  .actions{display:flex; gap:10px; justify-content:center; margin:16px 0 4px; flex-wrap:wrap;}
  .overlay{
    position:fixed; inset:0; background:rgba(4,6,14,.92);
    display:none; align-items:flex-start; justify-content:center; z-index:20; overflow-y:auto;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));
  }
  .overlay.open{display:flex;}
  .sheet{
    width:100%; max-width:560px; background:var(--panel); border:2px solid var(--gold-d);
    box-shadow:4px 4px 0 #000; padding:14px; position:relative;
  }
  .sheet h2{margin:0 0 12px; font-size:13px; color:var(--gold); text-transform:uppercase; letter-spacing:2px;}
  .close-btn{position:absolute; top:8px; right:8px;}
  .zoom-wrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  canvas.cv.zoom{width:270px; height:480px; cursor:default;}
  @media (max-height:760px){ canvas.cv.zoom{width:180px; height:320px;} }
  .zoom-info{width:100%;}
  .zoom-info h3{margin:0 0 4px; font-size:14px; color:var(--gold); text-transform:uppercase; letter-spacing:1px;}
  .zoom-info .meta{font-size:10px; color:#8a7ab8; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;}
  .zoom-info p{margin:0 0 8px; font-size:12px; color:var(--ink-dim); line-height:1.55;}
  .pol-row{display:flex; gap:8px; justify-content:center;}
  .gallery-group{margin:4px 0 14px;}
  .gallery-group h4{margin:0 0 8px; font-size:10px; color:var(--gold); letter-spacing:2px; text-transform:uppercase;}
  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fill, 90px); gap:12px 10px; justify-content:center;}
  .g-item{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .g-item span{font-size:8px; color:var(--ink-dim); text-align:center; line-height:1.2; max-width:90px;}
  .history-item{border-bottom:1px dashed var(--line); padding:8px 0; font-size:11px;}
  .history-item .h-date{color:var(--ink-dim); font-size:10px;}
  .history-item .h-cards{color:var(--gold); margin-top:3px; line-height:1.5;}
  .empty-history{color:var(--ink-dim); font-size:12px; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn left" id="galleryBtn" aria-label="Galeria do baralho">▦</button>
    <h1>Oráculo das 52 Lâminas</h1>
    <p>Formule sua pergunta em silêncio, depois escolha a tiragem</p>
    <button class="icon-btn right" id="historyBtn" aria-label="Histórico">☰</button>
  </header>
  <main>
    <div class="spreads" id="spreadPicker"></div>
    <div class="spread-desc" id="spreadDesc"></div>
    <div id="board"></div>
    <div id="choicePanel"></div>
    <div class="hint" id="hint"></div>
    <div class="reading-info" id="readingInfo"></div>
    <div class="actions"><button class="pbtn big" id="newReadingBtn">Embaralhar de novo</button></div>
  </main>
</div>

<div class="overlay" id="zoomOverlay">
  <div class="sheet">
    <button class="pbtn close-btn" data-close="zoomOverlay">✕</button>
    <div class="zoom-wrap">
      <canvas class="cv zoom" id="zoomCv" width="90" height="160"></canvas>
      <div class="pol-row" id="polRow"></div>
      <div class="zoom-info" id="zoomInfo"></div>
    </div>
  </div>
</div>

<div class="overlay" id="galleryOverlay">
  <div class="sheet">
    <button class="pbtn close-btn" data-close="galleryOverlay">✕</button>
    <h2>O Baralho · 52 Lâminas</h2>
    <div id="galleryBody"></div>
  </div>
</div>

<div class="overlay" id="historyOverlay">
  <div class="sheet">
    <button class="pbtn close-btn" data-close="historyOverlay">✕</button>
    <h2>Histórico de leituras</h2>
    <div id="historyList"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const ROOT = typeof window !== "undefined" ? window : globalThis;

/* =====================================================================
   MOTOR DE PIXEL ART (grade nativa 90x160, 9:16, escala inteira)
   ===================================================================== */
const W = 90, H = 160;
const BAY = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay = (x,y) => (BAY[((y&3)<<2)|(x&3)] + .5) / 16;
const CC = {};
function rgb(h){
  if(typeof h !== "string") return h;
  let c = CC[h]; if(c) return c;
  let s = h.slice(1); if(s.length === 3) s = s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  c = [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
  CC[h] = c; return c;
}
const hex = c => "#" + c.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const mix = (a,b,t) => { const A=rgb(a), B=rgb(b); return hex([0,1,2].map(i => A[i]+(B[i]-A[i])*t)); };
const shade = (a,k) => hex(rgb(a).map(v => v*k));
const P4 = f => [0,1,2,1][f];
const SW = [0,1,0,-1];
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }

class Buf{
  constructor(){ this.d = new Uint8ClampedArray(W*H*4); }
  px(x,y,col,a){
    if(a === undefined) a = 1;
    x = Math.round(x); y = Math.round(y);
    if(x<0||y<0||x>=W||y>=H||a<=0) return;
    const c = rgb(col), d = this.d, i = (y*W+x)*4;
    if(a >= 1){ d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255; return; }
    const da = d[i+3]/255, oa = a + da*(1-a);
    d[i]   = (c[0]*a + d[i]*da*(1-a))/oa;
    d[i+1] = (c[1]*a + d[i+1]*da*(1-a))/oa;
    d[i+2] = (c[2]*a + d[i+2]*da*(1-a))/oa;
    d[i+3] = oa*255;
  }
  al(x,y){ return (x<0||y<0||x>=W||y>=H) ? 0 : this.d[(y*W+x)*4+3]; }
  rect(x,y,w,h,c,a){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) this.px(x+i,y+j,c,a); }
  circ(cx,cy,r,c,a){ const R=Math.ceil(r), rr=r*r+r*.8; for(let j=-R;j<=R;j++) for(let i=-R;i<=R;i++) if(i*i+j*j<=rr) this.px(cx+i,cy+j,c,a); }
  ring(cx,cy,r,c,a,t){ t=t||1; const R=Math.ceil(r), o=r*r+r*.8, n=(r-t)*(r-t)+(r-t)*.8; for(let j=-R;j<=R;j++) for(let i=-R;i<=R;i++){ const q=i*i+j*j; if(q<=o && q>n) this.px(cx+i,cy+j,c,a); } }
  ell(cx,cy,rx,ry,c,a){ for(let j=-Math.ceil(ry);j<=ry;j++) for(let i=-Math.ceil(rx);i<=rx;i++) if((i*i)/(rx*rx)+(j*j)/(ry*ry)<=1.05) this.px(cx+i,cy+j,c,a); }
  poly(p,c,a){
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(const q of p){ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); }
    for(let y=Math.max(0,Math.floor(y0)); y<=Math.min(H-1,Math.ceil(y1)); y++){
      for(let x=Math.max(0,Math.floor(x0)); x<=Math.min(W-1,Math.ceil(x1)); x++){
        const px=x+.5, py=y+.5; let ins=false;
        for(let i=0,j=p.length-1;i<p.length;j=i++){
          const xi=p[i][0], yi=p[i][1], xj=p[j][0], yj=p[j][1];
          if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins;
        }
        if(ins) this.px(x,y,c,a);
      }
    }
  }
  line(x0,y0,x1,y1,c,a,t){
    t=t||1; const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);
    for(let k=0;k<=n;k++){ const x=x0+(x1-x0)*k/n, y=y0+(y1-y0)*k/n;
      if(t<=1) this.px(x,y,c,a); else this.rect(Math.round(x-(t-1)/2),Math.round(y-(t-1)/2),t,t,c,a); }
  }
  grad(x,y,w,h,c1,c2,n){
    n=n||6; const Lv=[]; for(let k=0;k<n;k++) Lv.push(rgb(mix(c1,c2,k/(n-1))));
    for(let j=0;j<h;j++){ const t=(h<2?0:j/(h-1))*(n-1), lo=Math.floor(t), fr=t-lo;
      for(let i=0;i<w;i++){ const lv = fr>bay(x+i,y+j) ? Math.min(lo+1,n-1) : lo; this.px(x+i,y+j,Lv[lv]); } }
  }
  blob(cx,cy,rx,ry,c,dens,a){
    dens=dens||1;
    for(let j=-Math.ceil(ry);j<=ry;j++) for(let i=-Math.ceil(rx);i<=rx;i++){
      const q=Math.sqrt((i*i)/(rx*rx)+(j*j)/(ry*ry));
      if(q<=1 && (1-q)*dens > bay(Math.round(cx+i),Math.round(cy+j))) this.px(cx+i,cy+j,c,a);
    }
  }
  over(o,a){
    a = a===undefined ? 1 : a; const e=o.d;
    for(let i=0;i<W*H;i++){ const k=i*4, oa=e[k+3]/255*a; if(oa<=0) continue; this.px(i%W,(i/W)|0,[e[k],e[k+1],e[k+2]],oa); }
  }
  outline(c){
    const m=[];
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      if(this.al(x,y)>60) continue;
      if(this.al(x-1,y)>127||this.al(x+1,y)>127||this.al(x,y-1)>127||this.al(x,y+1)>127) m.push(x,y);
    }
    for(let i=0;i<m.length;i+=2) this.px(m[i],m[i+1],c);
  }
  rim(c,amt,dk){
    const A=new Uint8Array(W*H); for(let i=0;i<W*H;i++) A[i]=this.d[i*4+3];
    const al=(x,y)=>(x<0||y<0||x>=W||y>=H)?0:A[y*W+x]; const C=rgb(c), d=this.d;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      if(al(x,y)<128) continue; const i=(y*W+x)*4;
      if(al(x-1,y)<128||al(x,y-1)<128){ for(let k=0;k<3;k++) d[i+k]+=(C[k]-d[i+k])*amt; }
      else if(al(x+1,y)<128||al(x,y+1)<128){ for(let k=0;k<3;k++) d[i+k]*=dk; }
    }
  }
  flipV(){ const o=new Buf(); for(let y=0;y<H;y++) o.d.set(this.d.subarray(y*W*4,(y+1)*W*4),(H-1-y)*W*4); return o; }
  map(fn){ const d=this.d; for(let i=0;i<W*H;i++){ const k=i*4; if(!d[k+3]) continue; const r=fn(d[k],d[k+1],d[k+2],i%W,(i/W)|0); d[k]=r[0]; d[k+1]=r[1]; d[k+2]=r[2]; } }
}

/* ---------- Primitivas de cenário ---------- */
function stars(b,r,n,y1,f,cols){ cols=cols||["#FFFFFF","#BEE9E8"];
  for(let i=0;i<n;i++){ const x=(r()*W)|0, y=(r()*y1)|0, c=cols[i%cols.length], ph=(i+f)%4;
    b.px(x,y,c,ph===0?.35:1);
    if(i%6===0 && ph===2){ b.px(x-1,y,c,.6); b.px(x+1,y,c,.6); b.px(x,y-1,c,.6); b.px(x,y+1,c,.6); } } }
function mtn(b,r,base,hmin,hmax,c,snow,seg){ seg=seg||9; const p=[[0,H],[0,base-hmin]], pk=[]; let x=0;
  while(x<W+seg){ x+=seg*.5+r()*seg; const y=base-(hmin+r()*(hmax-hmin)); p.push([x,y]); pk.push([x,y]); }
  p.push([W+10,H]); b.poly(p,c);
  if(snow) pk.forEach(q=>{ if(q[1]<base-hmin-3) b.poly([[q[0]-3,q[1]+4],[q[0],q[1]],[q[0]+3,q[1]+4],[q[0]+1,q[1]+3],[q[0]-1,q[1]+5]],snow); }); }
function hills(b,base,amp,fr,ph,c){ for(let x=0;x<W;x++){ const y=Math.round(base-amp*(Math.sin(x*fr+ph)*.5+.5)); b.rect(x,y,1,H-y,c); } }
function waves(b,y0,y1,c1,c2,f,sp){ sp=sp||2; b.grad(0,y0,W,y1-y0,c1,shade(c1,.55),4);
  for(let y=y0+1;y<y1;y+=3) for(let x=0;x<W;x++) if(((x+y*3+f*sp)%11)<2) b.px(x,y,c2,.8); }
function pillar(b,x,y0,y1,w,cM,cL,cD){ b.rect(x,y0,w,y1-y0,cM); b.rect(x,y0,1,y1-y0,cL); b.rect(x+w-1,y0,1,y1-y0,cD); b.rect(x-1,y0-3,w+2,3,cL); b.rect(x-1,y1,w+2,2,cD); }
function tree(b,x,y,h,cT,cL,rad){ b.rect(x-1,y-h,3,h,cT); b.circ(x,y-h,rad,cL); b.circ(x-rad*.7,y-h+3,rad*.7,cL); b.circ(x+rad*.7,y-h+3,rad*.7,cL); }
function cloud(b,x,y,w,c1,c2){ for(let i=0;i<=w;i+=4){ const q=3+((i*7)%4); b.circ(x+i,y-q/2,q,c1); } b.rect(x-2,y,w+4,2,c2); }
function bolt(b,r,x,y0,y1,c,a){ let px=x,py=y0; while(py<y1){ const nx=px+Math.round((r()-.5)*8), ny=py+3+((r()*4)|0); b.line(px,py,nx,ny,c,a); if(r()<.25) b.line(nx,ny,nx+Math.round((r()-.5)*10),ny+6,c,(a||1)*.7); px=nx; py=ny; } }
function rays(b,cx,cy,n,len,c,a,rot){ rot=rot||0; for(let k=0;k<n;k++){ const an=rot+k*Math.PI*2/n; for(let t=5;t<len;t++){ if((t+k)%2) continue; b.px(cx+Math.cos(an)*t,cy+Math.sin(an)*t,c,a*(1-t/len)); } } }
function sun(b,cx,cy,rad,c1,c2,halo){ if(halo) b.blob(cx,cy,rad*2.2,rad*2.2,halo,1.2,.8); b.circ(cx,cy,rad,c2); b.circ(cx,cy,rad-2,c1); }
function moon(b,cx,cy,rad,c,cd){ b.circ(cx,cy,rad,c); b.circ(cx-rad*.3,cy-rad*.2,rad*.25,cd); b.circ(cx+rad*.35,cy+rad*.3,rad*.18,cd); }
function crescent(b,cx,cy,rad,c,dx){ const R=Math.ceil(rad), rr=rad*rad+rad*.8; for(let j=-R;j<=R;j++) for(let i=-R;i<=R;i++){ if(i*i+j*j<=rr && ((i-dx)*(i-dx)+j*j>rr*.85)) b.px(cx+i,cy+j,c); } }
function eclipse(b,cx,cy,rad,corona,f){ b.blob(cx,cy,rad*2.1,rad*2.1,corona,1+P4(f)*.12,.85); b.ring(cx,cy,rad+1,"#FFFFFF",1,1); b.circ(cx,cy,rad,"#050505"); }
function flame(b,x,y,h,f,cols,wm){ cols=cols||["#FFF3B0","#F4A300","#E0521B"]; wm=wm||1; const fl=SW[f];
  for(let k=0;k<h;k++){ const t=k/h, hw=Math.round((1-t)*h*.32*wm), ox=Math.round(fl*t*t*2);
    for(let i=-hw;i<=hw;i++){ const e=hw?Math.abs(i)/hw:0; const c=(e<.4&&t<.55)?cols[0]:(e<.75&&t<.8)?cols[1]:cols[2]; b.px(x+i+ox,y-k,c); } } }
function fall(b,r,n,c,f,dir,y0,y1,spd,a){ const R=y1-y0; for(let i=0;i<n;i++){ const x=(r()*W)|0, base=r()*R; const y=y0+(((base+dir*f*spd)%R)+R)%R; b.px(x,y,c,a); } }
function grass(b,r,y,n,c){ b.rect(0,y,W,H-y,c); for(let i=0;i<n;i++){ const x=(r()*W)|0, h=2+((r()*7)|0); b.line(x,y,x+(i%2?-1:1),y-h,c); } }
function rocks(b,r,y,n,c){ b.rect(0,y,W,H-y,c); for(let i=0;i<n;i++){ const x=r()*W, w=3+r()*8, h=2+r()*6; b.poly([[x-w,y+1],[x-w*.5,y-h*.7],[x,y-h],[x+w*.6,y-h*.6],[x+w,y+1]],c); } }
function mist(b,y0,n,c,a,f){ for(let k=0;k<n;k++){ const y=y0+k*6; for(let x=0;x<W;x++) if(((x+f*2+k*5)%9)<5) b.px(x,y+((x+k)%3===0?1:0),c,a); } }

/* ---------- Companheiros ---------- */
function dog(b,x,y,c,a,sg){ b.rect(x-3,y-8,6,8,c,a); b.circ(x+sg*2,y-11,3,c,a); b.poly([[x+sg*1,y-13],[x+sg*2,y-18],[x+sg*3,y-13]],c,a); b.rect(sg>0?x+4:x-6,y-11,3,2,c,a); b.rect(sg>0?x-6:x+3,y-3,3,2,c,a); b.px(x+sg*3,y-12,"#FFFFFF",Math.min(1,a+.3)); }
function tiger(b,x,y,f){ const o="#E07A20", w="#F4E8D0";
  b.ell(x+4,y-9,12,6,o); b.ell(x+4,y-6,10,3,w);
  for(let k=0;k<6;k++) b.line(x-4+k*3,y-15,x-5+k*3,y-9,"#1a1008");
  b.circ(x-9,y-14,5,o); b.rect(x-13,y-13,4,3,w); b.px(x-11,y-15,"#1a1008"); b.px(x-7,y-15,"#1a1008");
  b.poly([[x-12,y-18],[x-11,y-21],[x-9,y-18]],o); b.poly([[x-7,y-18],[x-6,y-21],[x-4,y-18]],o);
  [-4,0,8,12].forEach(dx=>b.rect(x+dx,y-4,3,5,o));
  b.line(x+16,y-11,x+20,y-16-SW[f],o,1,2); }
function raven(b,x,y,sg,f){ b.ell(x,y,3,2,"#0a0a12"); b.circ(x+sg*2,y-2,2,"#0a0a12"); b.px(x+sg*4,y-2,"#4a4a4a"); b.px(x+sg*2,y-3,"#9ad8ff"); b.line(x-sg*3,y,x-sg*5,y+2,"#0a0a12"); if(f%2) b.line(x,y-1,x-sg*3,y-5,"#1a1a28"); }
function bird(b,x,y,c,f){ b.rect(x-1,y,3,2,c); b.px(x+2,y-1,c); if(f%2){ b.px(x-1,y-1,c); b.px(x-2,y-2,c); } else b.px(x-2,y+1,c); }
function owl(b,x,y,f){ const c="#8a8a90"; b.ell(x,y,3,4,c); b.circ(x,y-4,3,c); b.px(x-1,y-4,"#FFD34E"); b.px(x+1,y-4,"#FFD34E"); const up=f%2?-4:2; b.poly([[x-2,y-1],[x-12,y+up],[x-9,y+3]],c); b.poly([[x+2,y-1],[x+12,y+up],[x+9,y+3]],c); }
function horse(b,x,y,sg,f){ const c="#FFB020", d="#E0621B";
  b.ell(x,y-15,11,6,c); b.ell(x,y-13,9,3,d,.5);
  b.poly([[x+sg*6,y-19],[x+sg*8,y-32],[x+sg*12,y-33],[x+sg*12,y-22],[x+sg*9,y-14]],c);
  b.poly([[x+sg*10,y-34],[x+sg*18,y-29],[x+sg*17,y-26],[x+sg*10,y-27]],c);
  b.px(x+sg*13,y-31,"#3a1a00"); b.px(x+sg*17,y-28,"#3a1a00");
  [-8,-5,5,8].forEach((dx,i)=>{ b.line(x+dx,y-11,x+dx,y-2,d,1,2); b.rect(x+dx-1,y-1,3,2,"#5a2a00"); });
  for(let k=0;k<4;k++) flame(b,x+sg*(7+k),y-24+k*3,4+((k+f)%2)*2,f,["#FFFFFF","#FFF3B0","#FF9A2A"]);
  flame(b,x-sg*10,y-14,6,f,["#FFF3B0","#FF9A2A","#E0321B"]); }
function ram(b,x,y,c){ b.ell(x,y-9,10,6,c); for(let k=0;k<8;k++) b.px(x-8+k*2,y-12+(k%2),mix(c,"#FFFFFF",.3)); b.circ(x-10,y-13,4,c); b.ring(x-9,y-15,3,"#F7D070",1,1); b.px(x-12,y-13,"#1a0a00"); [-6,-2,4,8].forEach(dx=>b.rect(x+dx,y-4,2,4,"#5a3010")); }
function wolf(b,x,y){ const c="#7a7a82"; b.ell(x,y-4,10,4,c); b.ell(x,y-3,8,2,"#9a9aa2"); b.circ(x-9,y-6,3,c); b.poly([[x-11,y-8],[x-10,y-12],[x-8,y-8]],c); b.rect(x-14,y-6,3,2,c); b.px(x-10,y-7,"#1a1a1a"); b.line(x+10,y-4,x+15,y-2,c,1,2); }
function fish(b,x,y,sg,c){ b.ell(x,y,3,1.5,c); b.poly([[x-sg*3,y],[x-sg*6,y-2],[x-sg*6,y+2]],c); b.px(x+sg*2,y,"#1a1a1a"); }

/* ---------- Figura humanoide parametrizada ---------- */
const HP = {down:[13,42], open:[21,26], up:[14,2], chest:[4,27], hold:[12,32], fwd:[16,24], high:[12,-6], side:[18,38]};
const dv = (v,d) => v==null ? d : v;

function wings(L,cx,T,w){
  const s=L.s, gf=L.gf, f=L.f, fl=[0,-1,-2,-1][f], p=P4(f);
  if(w.type==="fire"){
    const PS=[[[0,0],[8,-16],[20,-30],[18,-14],[26,-10],[12,6]],[[0,4],[16,-2],[34,0],[26,8],[34,18],[12,14]],[[0,10],[10,22],[22,38],[14,34],[8,44],[2,22]]];
    for(const sg of [-1,1]) PS.forEach((pts,k)=>{
      const pp=pts.map(([x,y])=>[cx+sg*(6+x),T+18+y+(k===0?fl:0)]);
      s.poly(pp,k===1?"#FF9A2A":"#FF7A1A");
      s.poly(pp.map(([x,y])=>[cx+sg*6+(x-cx-sg*6)*.6,T+18+(y-T-18)*.6]),"#FFD34E");
      const m=pp[2], ex=Math.round((m[0]+cx+sg*6)/2), ey=Math.round((m[1]+T+18)/2);
      s.rect(ex-1,ey,3,2,"#FFFFFF"); s.px(ex,ey,"#1a1a40");
      gf.poly(pp,"#FFB020",.1+p*.07);
    });
    return;
  }
  if(w.type==="arm"){
    for(const sg of [-1,1]){
      const pts=[[cx+sg*8,T+16],[cx+sg*24,T+22],[cx+sg*41,T+16],[cx+sg*43,T+26],[cx+sg*36,T+42],[cx+sg*22,T+50],[cx+sg*9,T+36]];
      s.poly(pts,w.c);
      for(let q=0;q<4;q++) s.line(cx+sg*(14+q*7),T+22+q,cx+sg*(12+q*6),T+44+q,w.c2);
      s.line(cx+sg*12,T+20,cx+sg*40,T+18,mix(w.c,"#FFFFFF",.5));
    }
    return;
  }
  if(w.type==="iris"){
    const C=["#FF6A6A","#FFB04A","#FFF06A","#6AE06A","#6AB0FF","#B07AFF"];
    for(const sg of [-1,1]) C.forEach((c,q)=>{ const k=1-q*.12;
      s.poly([[cx+sg*6,T+18],[cx+sg*(6+24*k),T+2+fl],[cx+sg*(6+34*k),T+10+fl],[cx+sg*(6+28*k),T+34],[cx+sg*(6+14*k),T+50]],c,.3); });
    return;
  }
  for(const sg of [-1,1]){
    const c=sg<0?(w.cl||w.c):(w.cr||w.c);
    const pts=[[cx+sg*6,T+18],[cx+sg*16,T+4+fl],[cx+sg*30,T-6+fl*2],[cx+sg*38,T+4+fl*2],[cx+sg*34,T+22+fl],[cx+sg*26,T+44],[cx+sg*16,T+60],[cx+sg*8,T+38]];
    s.poly(pts,c);
    for(let q=0;q<5;q++) s.line(cx+sg*(12+q*5),T+8+q*2+fl,cx+sg*(10+q*4),T+34+q*5,shade(c,.78));
    s.line(cx+sg*16,T+4+fl,cx+sg*30,T-6+fl*2,w.c2||mix(c,"#FFFFFF",.5));
    if(w.glow) gf.poly(pts,w.glow,.08+p*.07);
  }
}

function multiArms(L,cx,T,o){
  const s=L.s, sk=o.skin;
  [[24,6,"sword"],[27,18,"disc"],[23,40,"bow"]].forEach(([dx,dy,wp])=>{
    for(const sg of [-1,1]){
      const hx=cx+sg*dx, hy=T+dy;
      s.line(cx+sg*8,T+19,hx,hy,sk,1,2); s.rect(hx-1,hy-1,3,3,sk);
      if(wp==="sword") s.line(hx,hy,hx+sg*2,hy-8,"#DFE6EE");
      else if(wp==="disc") s.ring(hx,hy-3,2.2,"#F7D070",1,1);
      else s.line(hx,hy-6,hx,hy+6,"#8a5a2a");
    }
  });
}

function head(L,cx,T,o){
  const s=L.s, gf=L.gf, f=L.f, hy=T+7, sk=o.skin||"#c68a5a", hr=o.hair||"#1a1210", ey=o.eye||"#140c08", h=o.head||"hair";
  const hairBase=()=>{ s.circ(cx,hy-1,7,hr); s.ell(cx,hy+1,5,5,sk); };
  const eyes=()=>{
    if(o.oneEye){ s.px(cx-2,hy,o.oneEye); s.rect(cx+1,hy-1,3,2,"#111111"); gf.circ(cx-2,hy,2,o.oneEye,.35); }
    else { s.px(cx-2,hy,ey); s.px(cx+2,hy,ey); if(o.eyeGlow){ gf.circ(cx-2,hy,1.5,o.eyeGlow,.5); gf.circ(cx+2,hy,1.5,o.eyeGlow,.5); } }
    if(o.smile){ s.px(cx-1,hy+3,shade(sk,.55)); s.px(cx,hy+4,shade(sk,.55)); s.px(cx+1,hy+3,shade(sk,.55)); }
  };
  const beard=()=>{ if(!o.beard) return; const lg=o.beardLong?13:8; s.poly([[cx-5,hy+2],[cx+5,hy+2],[cx+3,hy+lg],[cx,hy+lg+2],[cx-3,hy+lg]],o.beard); s.px(cx,hy+3,shade(sk,.6)); };
  switch(h){
    case "ibis":
      s.circ(cx,hy,6,"#F4F4F0"); s.circ(cx,hy+2,4,"#E4E4DC"); s.px(cx+2,hy-1,"#111111");
      s.line(cx+4,hy+1,cx+13,hy+8,"#1a1a1a",1,2); s.line(cx+13,hy+8,cx+14,hy+12,"#1a1a1a");
      s.rect(cx-4,hy+5,9,2,"#F7D070"); return;
    case "jackal":
      s.poly([[cx-8,hy-3],[cx+8,hy-3],[cx+10,hy+14],[cx-10,hy+14]],"#1a3a8a");
      for(let y=hy-2;y<hy+14;y+=2) s.line(cx-9,y,cx+9,y,"#F7D070");
      s.circ(cx,hy,6,"#111111");
      s.poly([[cx-5,hy-3],[cx-3,hy-15],[cx-1,hy-4]],"#111111"); s.poly([[cx+1,hy-4],[cx+3,hy-15],[cx+5,hy-3]],"#111111");
      s.px(cx-3,hy-10,"#3a2a2a"); s.px(cx+3,hy-10,"#3a2a2a");
      s.poly([[cx+3,hy-1],[cx+13,hy+3],[cx+12,hy+6],[cx+3,hy+5]],"#111111");
      s.px(cx+2,hy-1,"#F7D070"); gf.px(cx+2,hy-1,"#FFE08a",.7); return;
    case "straw": return;
    case "hood": s.circ(cx,hy,8,o.hoodCol||o.robe); s.ell(cx,hy+2,4,5,sk); eyes(); beard(); return;
    case "veil":
      s.ell(cx,hy+1,5,6,sk); eyes();
      s.circ(cx,hy-1,8,o.veil||"#E0E0F0",.75);
      s.poly([[cx-8,hy],[cx+8,hy],[cx+11,hy+18],[cx-11,hy+18]],o.veil||"#E0E0F0",.5); return;
    case "triple":
      [-9,9].forEach(dx=>{ s.circ(cx+dx,hy+2,4,sk); s.px(cx+dx+(dx<0?-1:1),hy+1,ey); s.circ(cx+dx,hy,5,o.veil,.55); });
      s.ell(cx,hy+1,5,6,sk); eyes(); s.circ(cx,hy-1,8,o.veil,.65);
      s.poly([[cx-8,hy],[cx+8,hy],[cx+12,hy+20],[cx-12,hy+20]],o.veil,.45); return;
    case "half":
      hairBase(); eyes();
      for(let j=-4;j<=6;j++) for(let i=1;i<=5;i++) if(i*i+(j-1)*(j-1)<=28) s.px(cx+i,hy+j,"#E4DED2");
      s.rect(cx+1,hy-1,3,2,"#1a1a22"); s.px(cx+2,hy+3,"#1a1a22");
      for(let i=1;i<5;i++) s.px(cx+i,hy+5,i%2?"#1a1a22":"#E4DED2"); return;
  }
  hairBase(); eyes(); beard();
  switch(h){
    case "bald": s.circ(cx,hy-3,4,sk); s.ell(cx,hy+1,5,5,sk); eyes(); break;
    case "conical": { const c1=o.hat[0], c2=o.hat[1];
      s.poly([[cx-8,hy-3],[cx+8,hy-3],[cx+2,hy-21]],c1); s.poly([[cx-8,hy-3],[cx,hy-3],[cx+2,hy-21]],c2);
      s.rect(cx-8,hy-4,17,2,"#F7D070"); break; }
    case "hat_wide":
      s.poly([[cx-6,hy-5],[cx+6,hy-5],[cx+4,hy-12],[cx-4,hy-12]],o.hatCol);
      s.rect(cx-12,hy-5,25,2,o.hatCol); s.rect(cx-12,hy-4,25,1,shade(o.hatCol,.7)); break;
    case "helmet":
      s.poly([[cx-7,hy+1],[cx-7,hy-4],[cx-4,hy-8],[cx+4,hy-8],[cx+7,hy-4],[cx+7,hy+1],[cx+4,hy+1],[cx+4,hy-2],[cx-4,hy-2],[cx-4,hy+1]],o.helm);
      s.rect(cx,hy-2,1,5,o.helm); s.rect(cx-6,hy-7,13,1,mix(o.helm,"#FFFFFF",.4));
      if(o.crest) s.poly([[cx-2,hy-8],[cx+2,hy-8],[cx+4,hy-16],[cx-8,hy-15],[cx-9,hy-11]],o.crest); break;
    case "crown": { const c=o.crownCol||"#F7D070";
      s.rect(cx-6,hy-8,13,3,c); [-5,0,5].forEach(dx=>s.line(cx+dx,hy-8,cx+dx,hy-11,c));
      s.px(cx,hy-7,o.gem||"#C8102E"); break; }
    case "rays12":
      for(let k=0;k<12;k++){ const an=Math.PI*(1+k/11); s.line(cx+Math.cos(an)*8,hy-1+Math.sin(an)*8,cx+Math.cos(an)*13,hy-1+Math.sin(an)*13,"#FFD34E"); }
      gf.blob(cx,hy-4,14,12,"#FFE08a",1,.35+.1*P4(f)); break;
    case "feather":
      s.rect(cx-6,hy-5,13,2,"#40C0C0");
      s.poly([[cx,hy-6],[cx+2,hy-6],[cx+5,hy-22],[cx+2,hy-24],[cx-1,hy-16]],"#FFFFFF");
      s.line(cx+1,hy-6,cx+3,hy-22,"#C8C8D0"); break;
    case "wheat":
      for(let k=0;k<7;k++){ const an=Math.PI*(1.1+k*.8/6);
        const x1=cx+Math.cos(an)*6, y1=hy-2+Math.sin(an)*6, x2=cx+Math.cos(an)*12, y2=hy-2+Math.sin(an)*12;
        s.line(x1,y1,x2,y2,"#DDA15E"); s.px(x2,y2,"#FFD34E"); } break;
    case "horns":
      for(const sg of [-1,1]){ s.line(cx+sg*4,hy-5,cx+sg*8,hy-15,o.hornCol,1,2); s.line(cx+sg*7,hy-11,cx+sg*11,hy-13,o.hornCol); s.line(cx+sg*6,hy-8,cx+sg*9,hy-7,o.hornCol); } break;
    case "flamehair":
      for(let k=0;k<5;k++) flame(s,cx-6+k*3,hy-3,8+((k+f)%3)*2,f,["#FFF3B0","#FF9A2A","#E0321B"]); break;
    case "spiky":
      for(let k=0;k<7;k++){ const an=Math.PI*(1.05+k*.9/6);
        s.poly([[cx+Math.cos(an)*5-2,hy-1+Math.sin(an)*5],[cx+Math.cos(an)*14,hy-1+Math.sin(an)*14],[cx+Math.cos(an)*5+2,hy-1+Math.sin(an)*5]],hr); } break;
    case "twoface":
      s.circ(cx-8,hy+1,4,sk); s.px(cx-10,hy,ey); s.px(cx-11,hy+2,shade(sk,.6)); break;
    case "templewings":
      for(const sg of [-1,1]) s.poly([[cx+sg*6,hy-2],[cx+sg*13,hy-7+SW[f]],[cx+sg*12,hy-3],[cx+sg*14,hy-1],[cx+sg*7,hy+1]],"#F4F4F0"); break;
  }
  if(o.halo){ L.gb.ring(cx,hy-1,11,o.halo,.85,2); L.gb.blob(cx,hy-1,15,15,o.halo,1,.25); }
}

function item(L,k,x,y,sg,o){
  const s=L.s, gf=L.gf, gb=L.gb, f=L.f, p=P4(f);
  switch(k){
    case "torch": s.rect(x,y-12,1,15,"#5a3a1a"); s.rect(x-1,y-13,3,2,"#3a2a1a"); flame(s,x,y-14,7,f); gb.blob(x,y-18,11,11,"#F4A300",1,.35); break;
    case "staff": s.line(x,y-34,x,y+30,"#6b4423",1,2); s.circ(x,y-35,2,"#8a6a3a"); break;
    case "ogo": s.line(x,y-18,x,y+8,"#3a2415",1,2); s.circ(x,y-19,3,"#3a2415"); for(let q=0;q<5;q++) s.px(x+(q%2?1:-1),y-16+q*3,"#FFFFFF"); s.px(x,y-20,"#C8102E"); break;
    case "sword": s.rect(x,y-24,2,22,"#DFE6EE"); s.rect(x,y-24,1,22,"#FFFFFF"); s.rect(x-3,y-2,8,2,"#F7D070"); s.rect(x,y,2,4,"#5a3a1a"); break;
    case "coppersword": s.rect(x,y-22,2,20,"#d8905a"); s.rect(x,y-22,1,20,"#f0c090"); s.rect(x-3,y-2,8,2,"#b87333"); s.rect(x,y,2,4,"#3a2010"); gf.blob(x+1,y-12,4,12,"#FFB080",1,.2+p*.05); break;
    case "flamesword":
      s.rect(x-2,y-3,6,2,"#F7D070"); s.rect(x,y-1,2,4,"#5a3a1a");
      for(let j=0;j<26;j++){ const c=j<9?"#FFFFFF":j<17?"#FFD34E":"#FF7A1A"; s.rect(x,y-4-j,2,1,c); if((j+f)%3===0) s.px(x+(j%2?-1:2),y-4-j,"#FF7A1A"); }
      gf.blob(x+1,y-17,7,17,"#FFB020",1.2,.3+p*.08); break;
    case "spear": s.line(x,y-42,x,y+26,"#7a5a3a"); s.poly([[x-2,y-40],[x+2,y-40],[x,y-48]],"#DFE6EE"); break;
    case "spearD": s.line(x-8,y+16,x+20,y-40,"#7a5a3a"); s.poly([[x+17,y-36],[x+22,y-38],[x+24,y-46]],"#EEF2F6"); gf.line(x+24,y-46,x+30,y-58,"#FFFFFF",.6); break;
    case "trumpet": { const mx=o.cx+5, my=o.T+9;
      s.line(mx,my,mx+20,my-12,"#F7D070",1,2); s.circ(mx+21,my-13,3,"#FFE9A0"); s.circ(mx+21,my-13,1,"#b8862b");
      for(let q=0;q<6;q++){ const d=5+q*5+f*2; gf.px(mx+22+d*.8,my-14-d*.6+(q%2?2:-2),"#FFF3B0",.95); gf.px(mx+23+d*.8,my-14-d*.6,"#FFFFFF",.6); }
      break; }

function human(L,o){
  const s=L.s, f=L.f, sw=o.still?0:SW[f];
  const cx=dv(o.cx,45), T=dv(o.T,44), B=dv(o.B,134);
  const skin=o.skin||"#c68a5a", robe=o.robe||"#6a5a8a", trim=o.trim||mix(robe,"#FFFFFF",.35), dk=shade(robe,.7);
  const seat=o.pose==="seat";
  const tunic=o.tunic||o.pose==="step"||o.pose==="run"||o.pose==="dance";
  const hemY=seat?B:(tunic?T+54:B);
  o.cx=cx; o.T=T; o.B=B;
  if(o.hairLong) s.poly([[cx-7,T+3],[cx+7,T+3],[cx+9+sw,T+dv(o.hairLen,32)],[cx-9+sw,T+dv(o.hairLen,32)]],o.hair||"#1a1210");
  if(o.wings) wings(L,cx,T,o.wings);
  if(o.cape) s.poly([[cx-9,T+15],[cx+9,T+15],[cx+18+sw*2,B],[cx-18+sw*2,B]],o.cape);
  if(o.back) o.back(L,cx,T,B);
  if(tunic && !seat){
    const lc=o.legs||skin; let fx1=cx-6, fx2=cx+6;
    if(o.pose==="step"){ fx1=cx-11; fx2=cx+9; }
    if(o.pose==="run"){ fx1=cx-14; fx2=cx+12; }
    s.line(cx-5,hemY-2,fx1,B,lc,1,3);
    if(o.pose==="dance"){ s.line(cx+5,hemY-2,cx+13,hemY+10,lc,1,3); s.line(cx+13,hemY+10,cx-1,hemY+15,lc,1,3); }
    else s.line(cx+5,hemY-2,fx2,B,lc,1,3);
    s.rect(fx1-2,B,4,2,o.feet||shade(lc,.6));
    if(o.pose!=="dance") s.rect(fx2-2,B,4,2,o.feet||shade(lc,.6));
  }
  if(seat){
    s.ell(cx,B-5,17,6,robe); s.rect(cx-16,B-5,33,1,trim);
    s.poly([[cx-9,T+15],[cx+9,T+15],[cx+11,B-6],[cx-11,B-6]],robe);
    s.poly([[cx+3,T+15],[cx+9,T+15],[cx+11,B-6],[cx+4,B-6]],dk,.5);
  } else {
    const hw=tunic?11:13;
    s.poly([[cx-9,T+15],[cx+9,T+15],[cx+hw+sw,hemY],[cx-hw+sw,hemY]],robe);
    s.poly([[cx+3,T+15],[cx+9,T+15],[cx+hw+sw,hemY],[cx+4+sw,hemY]],dk,.55);
    s.line(cx-hw+sw,hemY-1,cx+hw+sw,hemY-1,trim,1,2);
    if(!tunic && !o.noFeet){ s.rect(cx-6+sw,B,4,2,o.feet||shade(skin,.7)); s.rect(cx+3+sw,B,4,2,o.feet||shade(skin,.7)); }
  }
  if(o.bare){ s.poly([[cx-8,T+15],[cx+8,T+15],[cx+7,T+32],[cx-7,T+32]],skin); s.line(cx,T+21,cx,T+30,shade(skin,.8)); }
  if(o.armor){ s.rect(cx-8,T+16,17,15,o.armor); s.rect(cx-8,T+16,17,1,mix(o.armor,"#FFFFFF",.5)); s.line(cx,T+17,cx,T+30,shade(o.armor,.75)); s.rect(cx-11,T+14,5,4,shade(o.armor,.9)); s.rect(cx+7,T+14,5,4,shade(o.armor,.9)); }
  if(o.collar){ s.ell(cx,T+17,8,3,o.collar); s.line(cx-7,T+18,cx+7,T+18,shade(o.collar,.7)); }
  s.rect(seat?cx-9:cx-8,T+32,seat?19:17,2,trim);
  s.rect(cx-2,T+11,5,5,skin);
  const hands={};
  ["L","R"].forEach(side=>{
    const sg=side==="L"?-1:1, pose=(side==="L"?o.armL:o.armR)||o.arms||"down", hp=HP[pose]||HP.down;
    const sx=cx+sg*9, sy=T+17, hx=cx+sg*hp[0], hy=T+hp[1];
    const ac=o.bareArms?skin:(o.sleeve||robe);
    const ex=(sx+hx)/2+sg*2, ey=(sy+hy)/2+2;
    s.line(sx,sy,ex,ey,ac,1,3); s.line(ex,ey,hx,hy,o.bareArms?skin:(o.fore||ac),1,3);
    s.rect(hx-1,hy-1,3,3,skin); hands[side]=[hx,hy];
  });
  if(o.multi) multiArms(L,cx,T,o);
  head(L,cx,T,o);
  if(o.l) item(L,o.l,hands.L[0],hands.L[1],-1,o);
  if(o.r) item(L,o.r,hands.R[0],hands.R[1],1,o);
  if(o.front) o.front(L,cx,T,B,hands);
  return hands;
}

const glyphOf = ch => { const u=ch.toUpperCase(); if(ACC[u]) return {g:FONT[ACC[u][0]], m:ACC[u][1]}; return {g:FONT[u]||FONT[" "], m:null}; };
function textW(str){ let w=0; for(const ch of str) w+=glyphOf(ch).g[0].length+1; return Math.max(0,w-1); }
function text(b,str,x,y,col,sh){
  for(const ch of str){
    const {g,m}=glyphOf(ch), gw=g[0].length;
    const draw=(ox,oy,c)=>{
      g.forEach((row,j)=>{ for(let i=0;i<gw;i++) if(row[i]==="1") b.px(x+i+ox,y+j+oy,c); });

function frame(b,cat){
  const P=FRAME[cat==="major"?"major":cat==="special"?"special":"minor"];
  for(let k=0;k<4;k++){
    const x0=k, y0=k, x1=W-1-k, y1=H-1-k;

}
function hud(b,card,pol){

const state = {spread:SPREADS[1], rows:{meio:[],baixo:[],cima:[]}, pendingSecond:null, choiceMade:null};

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const makeDrawn = (card,pos) => ({pos, card, polarity: card.special ? (Math.random()<.5?"luz":"escuridao") : null, revealed:false, revealStart:0});
const totalCount = sp => sp.branch ? 2 : sp.meio.length + sp.baixo.length + sp.cima.length;

function drawNewReading(sp){
  const cards=shuffle(DECK).slice(0,totalCount(sp)); let i=0;
  state.spread=sp; state.rows={meio:[],baixo:[],cima:[]}; state.pendingSecond=null; state.choiceMade=null;
  sp.meio.forEach(p=>state.rows.meio.push(makeDrawn(cards[i++],p)));
  if(sp.branch) state.pendingSecond=cards[i];
  else { sp.baixo.forEach(p=>state.rows.baixo.push(makeDrawn(cards[i++],p))); sp.cima.forEach(p=>state.rows.cima.push(makeDrawn(cards[i++],p))); }
  render();
}
const rowRevealed = rn => state.rows[rn].length>0 && state.rows[rn].every(d=>d.revealed);
function rowUnlocked(rn){
  if(rn==="meio") return true;
  if(state.spread.branch) return rn==="baixo" ? state.choiceMade==="causa" : state.choiceMade==="consequencia";
  if(rn==="baixo") return rowRevealed("meio");
  return rowRevealed("meio") && rowRevealed("baixo");
}
const allRevealed = () => !state.pendingSecond && ["meio","baixo","cima"].every(rn=>state.rows[rn].every(d=>d.revealed));
function makeChoice(kind){
  const row=kind==="causa"?"baixo":"cima";
  state.choiceMade=kind; state.rows[row].push(makeDrawn(state.pendingSecond,{label:kind==="causa"?"A Causa":"A Consequência"})); state.pendingSecond=null;
  render();
}
const polLabel = p => p==="escuridao" ? "Escuridão" : "Luz";
const meaning = d => d.card.special ? (d.polarity==="escuridao" ? d.card.dark : d.card.light) : d.card.read;
function metaLine(card){ return card.special ? "Carta Especial · Dualidade Luz/Escuridão" : card.cat==="major" ? "Arcano Maior · "+card.numeral : card.group+" · Grau "+card.numeral+" · "+card.groupTheme; }

function saveToHistory(){
  try{
    const list=JSON.parse(localStorage.getItem("tarot_history")||"[]"), cards=[];
    ["meio","baixo","cima"].forEach(rn=>state.rows[rn].forEach(d=>cards.push(d.pos.label+": "+d.card.name+(d.polarity?" ("+polLabel(d.polarity)+")":""))));
    list.unshift({date:new Date().toISOString(), spread:state.spread.label, cards});
    localStorage.setItem("tarot_history",JSON.stringify(list.slice(0,30)));
  }catch(e){}
}

/* ---------- Pintura animada dos canvas ---------- */
const imgCache = {}, backCache = [];
let budget = 0;
const toImg = buf => new ImageData(new Uint8ClampedArray(buf.d), W, H);
function frontImg(card,pol,f,force){
  const k=card.id+"|"+(pol||"")+"|"+f;
  if(!imgCache[k]){ if(!force && budget<=0) return null; budget--; imgCache[k]=toImg(renderFront(card,pol,f)); }
  return imgCache[k];
}
function backImg(f){ if(!backCache[f]) backCache[f]=toImg(renderBack(f)); return backCache[f]; }
function dissolve(bi,fi,step){
  const out=new ImageData(W,H), o=out.data, a=bi.data, c=fi.data;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const src=BAY[(((y>>2)&3)<<2)|((x>>2)&3)]<step?c:a, i=(y*W+x)*4; o[i]=src[i]; o[i+1]=src[i+1]; o[i+2]=src[i+2]; o[i+3]=src[i+3]; }
  return out;
}
let live = [];
function mount(cv,d,prio){ const e={cv, ctx:cv.getContext("2d"), d, key:"", prio:!!prio}; live.push(e); return e; }
function paint(e,now){
  if(!e.cv.offsetParent) return;
  const d=e.d, f=Math.floor(now/500)%4; let key, img=null;
  if(!d.revealed){ key="b"+f; if(key!==e.key) img=backImg(f); }
  else {
    const t=d.revealStart?now-d.revealStart:1e9;
    if(t<680){ const st=Math.floor(t/40); key="d"+st+"|"+f+d.polarity; if(key!==e.key){ const fi=frontImg(d.card,d.polarity,f,true); img=dissolve(backImg(f),fi,st); } }
    else { key="f"+f+d.polarity; if(key!==e.key) img=frontImg(d.card,d.polarity,f,e.prio); }
  }
  if(img){ e.ctx.putImageData(img,0,0); e.key=key; }
}
function loop(now){
  budget=2; live=live.filter(e=>e.cv.isConnected);
  live.sort((a,b)=>b.prio-a.prio).forEach(e=>paint(e,now));
  requestAnimationFrame(loop);
}

/* ---------- Render da mesa ---------- */
const $ = id => document.getElementById(id);
const boardEl=$("board"), pickerEl=$("spreadPicker"), descEl=$("spreadDesc"), choiceEl=$("choicePanel"), infoEl=$("readingInfo"), hintEl=$("hint");

function renderPicker(){
  pickerEl.innerHTML="";
  SPREADS.forEach(sp=>{ const b=document.createElement("button"); b.className="pbtn"+(sp.id===state.spread.id?" active":""); b.textContent=sp.label; b.onclick=()=>drawNewReading(sp); pickerEl.appendChild(b); });
  descEl.textContent=state.spread.desc;
}
function makeCardEl(d,rn){
  const unlocked=rowUnlocked(rn), slot=document.createElement("div"); slot.className="slot";
  const lb=document.createElement("div"); lb.className="slot-label"; lb.textContent=d.pos.label; slot.appendChild(lb);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; cv.className="cv"+(unlocked?"":" locked");
  cv.onclick=()=>{ if(!unlocked) return;
    if(!d.revealed){ d.revealed=true; d.revealStart=performance.now(); render(); if(allRevealed()) saveToHistory(); }
    else openZoom(d,false); };
  slot.appendChild(cv); mount(cv,d,true);
  const nm=document.createElement("div"); nm.className="slot-name"; nm.textContent=d.revealed?d.card.name:""; slot.appendChild(nm);
  return slot;
}
function renderBoard(){
  boardEl.innerHTML="";
  ROW_ORDER.forEach(rn=>{ const es=state.rows[rn]; if(!es.length) return;
    const blk=document.createElement("div"); blk.className="row-block";
    const hd=document.createElement("div"); hd.className="row-header"; hd.textContent=ROW_TITLE[rn]; blk.appendChild(hd);
    const wr=document.createElement("div"); wr.className="row-cards"; es.forEach(d=>wr.appendChild(makeCardEl(d,rn))); blk.appendChild(wr);
    boardEl.appendChild(blk); });
}
function renderChoice(){
  choiceEl.innerHTML="";
  if(!state.spread.branch || !rowRevealed("meio") || state.choiceMade) return;
  const pn=document.createElement("div"); pn.className="choice-panel";
  pn.innerHTML="<p>O cartomante decide: investigar o Passado (Causa) ou prever o Futuro (Consequência)?</p>";
  const rw=document.createElement("div"); rw.className="choice-row";
  [["causa","Por quê · A Causa"],["consequencia","Para onde · A Consequência"]].forEach(([k,t])=>{ const b=document.createElement("button"); b.className="pbtn"; b.textContent=t; b.onclick=()=>makeChoice(k); rw.appendChild(b); });
  pn.appendChild(rw); choiceEl.appendChild(pn);
}
function renderInfo(){
  infoEl.innerHTML="";
  ["meio","baixo","cima"].forEach(rn=>state.rows[rn].forEach(d=>{
    if(!d.revealed) return;
    const bx=document.createElement("div"); bx.className="card-detail"; bx.style.setProperty("--acc",ACCENT[d.card.cat]);
    bx.innerHTML="<h3></h3><p class='meaning'></p>"+(d.card.groupTheme?"<div class='suitline'></div>":"");
    bx.querySelector("h3").textContent=d.card.name;
    if(d.polarity){ const t=document.createElement("span"); t.className="tagp"+(d.polarity==="escuridao"?" esc":""); t.textContent=polLabel(d.polarity); bx.querySelector("h3").appendChild(t); }
    const strong=document.createElement("strong"); strong.textContent=ROW_TITLE[rn]+" — "+d.pos.label+": ";
    const mp=bx.querySelector(".meaning"); mp.appendChild(strong); mp.appendChild(document.createTextNode(meaning(d)));
    if(d.card.groupTheme) bx.querySelector(".suitline").textContent=d.card.group+" — "+d.card.groupTheme;
    bx.onclick=()=>openZoom(d,false);
    infoEl.appendChild(bx);
  }));
  let msg=null; const any=["meio","baixo","cima"].some(rn=>state.rows[rn].some(d=>d.revealed));
  if(!rowRevealed("meio")) msg=any?"Abra as demais cartas do Presente antes de seguir.":"Toque nas lâminas do Presente para revelá-las.";
  else if(state.spread.branch && !state.choiceMade) msg=null;
  else if(state.rows.baixo.length && !rowRevealed("baixo")) msg="Agora abra a fileira do Passado.";
  else if(state.rows.cima.length && !rowRevealed("cima")) msg="Por fim, abra a fileira do Futuro.";
  hintEl.style.display=msg?"block":"none"; if(msg) hintEl.textContent=msg;
}
function render(){ renderPicker(); renderBoard(); renderChoice(); renderInfo(); }

const zoomCv=$("zoomCv"), zoomEntry=mount(zoomCv,{card:DECK[0],polarity:null,revealed:true},true);
function openZoom(d,fromGallery){
  const z={card:d.card, polarity:d.polarity, revealed:true, revealStart:0, pos:d.pos};
  zoomEntry.d=z; zoomEntry.key=""; live.includes(zoomEntry)||live.push(zoomEntry);
  const polRow=$("polRow"); polRow.innerHTML="";
  const fill=()=>{
    const info=$("zoomInfo"); info.innerHTML="";
    const h=document.createElement("h3"); h.textContent=z.card.name; info.appendChild(h);
    const m=document.createElement("div"); m.className="meta"; m.textContent=metaLine(z.card); info.appendChild(m);
    if(z.pos && !fromGallery){ const p=document.createElement("p"); p.innerHTML="<strong></strong>"; p.firstChild.textContent="Posição: "+z.pos.label; info.appendChild(p); }
    const p1=document.createElement("p"); p1.textContent=z.card.desc; info.appendChild(p1);
    const p2=document.createElement("p");
    if(z.card.special){ p2.textContent=polLabel(z.polarity)+": "+(z.polarity==="escuridao"?z.card.dark:z.card.light); }
    else p2.textContent="Como ler: "+z.card.read;
    info.appendChild(p2);
  };
  if(z.card.special && fromGallery){
    ["luz","escuridao"].forEach(pl=>{ const b=document.createElement("button"); b.className="pbtn"+(z.polarity===pl?" active":""); b.textContent=polLabel(pl);
      b.onclick=()=>{ z.polarity=pl; zoomEntry.key=""; [...polRow.children].forEach(c=>c.classList.remove("active")); b.classList.add("active"); fill(); }; polRow.appendChild(b); });
  }
  fill();
  $("zoomOverlay").classList.add("open");
}

function renderHistory(){

  const el=$("historyList"); el.innerHTML="";
  if(!list.length){ el.innerHTML="<div class='empty-history'>Nenhuma leitura salva ainda.</div>"; return; }
  list.forEach(item=>{
    const d=new Date(item.date), row=document.createElement("div"); row.className="history-item";
    const a=document.createElement("div"); a.className="h-date"; a.textContent=d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+" · "+item.spread;
    const b=document.createElement("div"); b.className="h-cards"; b.textContent=item.cards.join(" · ");
    row.appendChild(a); row.appendChild(b); el.appendChild(row);
  });
}

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove("open"));
document.querySelectorAll(".overlay").forEach(o=>o.onclick=e=>{ if(e.target===o) o.classList.remove("open"); });
$("historyBtn").onclick=()=>{ renderHistory(); $("historyOverlay").classList.add("open"); };
$("galleryBtn").onclick=()=>{ buildGallery(); $("galleryOverlay").classList.add("open"); };
$("newReadingBtn").onclick=()=>drawNewReading(state.spread);

drawNewReading(state.spread);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
