<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Oráculo das 52 Lâminas</title>
<style>
  :root{
    --bg-1:#150a2e;
    --bg-2:#2b1055;
    --gold:#d9b86c;
    --gold-soft:#f0dca4;
    --card-back-1:#3a1c71;
    --card-back-2:#7c2ae8;
    --ink:#f3ecff;
    --ink-dim:#c7b8e8;
    --danger:#e05f5f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg-1) 60%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; flex-direction:column;
  }
  header{
    text-align:center;
    padding:18px 16px 10px;
    flex-shrink:0;
    position:relative;
  }
  header h1{
    font-family:Georgia, "Times New Roman", serif;
    letter-spacing:1px;
    font-size:20px;
    margin:0;
    color:var(--gold-soft);
    text-shadow:0 0 12px rgba(217,184,108,.4);
  }
  header p{margin:4px 0 0; font-size:12px; color:var(--ink-dim);}
  .icon-btn{
    position:absolute; top:calc(18px + env(safe-area-inset-top)); right:16px;
    background:none; border:1px solid rgba(217,184,108,.4); color:var(--gold);
    border-radius:50%; width:36px; height:36px; font-size:16px; line-height:1;
    touch-action:manipulation; cursor:pointer;
  }
  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:8px 16px 24px; overflow-y:auto;
  }
  .spreads{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    margin:10px 0 18px;
  }
  .spread-btn{
    background:linear-gradient(160deg, rgba(217,184,108,.15), rgba(217,184,108,.03));
    border:1px solid rgba(217,184,108,.35);
    color:var(--gold-soft);
    padding:10px 16px; border-radius:20px;
    font-size:13px; touch-action:manipulation; cursor:pointer;
  }
  .spread-btn.active{
    background:var(--gold); color:#2b1055; font-weight:600;
    box-shadow:0 0 16px rgba(217,184,108,.5);
  }
  .board{
    display:flex; gap:16px; justify-content:center; flex-wrap:wrap;
    width:100%; margin-bottom:18px;
  }
  .slot{display:flex; flex-direction:column; align-items:center; gap:8px; width:104px;}
  .slot-label{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; min-height:14px;}
  /* Paletas 16-bit por categoria: p1/p2 = cor primária/secundária, hi = luz de destaque, sh = sombra */
  .cat-major{ --p1:#3A1F5D; --p2:#F7D070; --hi:#FFFFFF; --sh:#0E091C; }
  .cat-agua { --p1:#1B4965; --p2:#62B6CB; --hi:#BEE9E8; --sh:#0B1A24; }
  .cat-fogo { --p1:#9E2A2B; --p2:#E07A5F; --hi:#F4F1DE; --sh:#2B1717; }
  .cat-terra{ --p1:#386641; --p2:#A25A38; --hi:#DDA15E; --sh:#1B2418; }
  .cat-ar   { --p1:#3d5568; --p2:#D9DCD6; --hi:#F8F9FA; --sh:#212529; }
  .cat-special{ --p1:#1C1C1C; --p2:#ADB5BD; --hi:#FFFFFF; --sh:#050505; }

  .card{
    width:100px; height:168px;
    perspective:1000px;
    touch-action:manipulation;
    image-rendering:pixelated;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute; inset:0; border-radius:3px;
    backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    overflow:hidden;
  }
  /* ---- Verso: astrolábio 16-bit ---- */
  .card-back{
    background:#080D1A;
    border:4px solid #453205;
    box-shadow:inset 0 0 0 1px #D4AF37, inset 0 0 0 3px #8A6818, 0 6px 18px rgba(0,0,0,.45);
  }
  .card-back .stars{position:absolute; inset:0;}
  .card-back .nebula{
    position:absolute; inset:0;
    background:radial-gradient(circle at 30% 25%, rgba(31,17,51,.9), transparent 55%),
               radial-gradient(circle at 70% 75%, rgba(31,17,51,.7), transparent 50%);
  }
  .card-back svg{position:relative; width:76%; height:76%;}
  /* ---- Frente: moldura chanfrada 3 tons + HUD ---- */
  .card-front{
    transform:rotateY(180deg);
    background:linear-gradient(160deg, var(--p1), var(--sh));
    border:4px solid var(--p2);
    box-shadow:inset 0 0 0 1px var(--hi), inset 0 0 0 3px var(--sh), 0 6px 18px rgba(0,0,0,.45);
    color:var(--hi);
    flex-direction:column; padding:0; text-align:center;
  }
  .card-front .numeral{
    margin-top:6px; font-family:Georgia, serif; font-weight:700; font-size:11px;
    color:var(--p2); text-shadow:1px 1px 0 var(--sh), -1px -1px 0 var(--sh);
    letter-spacing:1px;
  }
  .card-front .glyph{
    position:absolute; width:13px; height:13px; color:var(--p2);
    filter:drop-shadow(0 0 2px rgba(0,0,0,.6));
    animation:breathe 2.4s ease-in-out infinite;
  }
  .card-front .glyph.tl{top:4px; left:4px;}
  .card-front .glyph.br{bottom:calc(30% + 4px); right:4px;}
  .card-front .footer{
    position:absolute; left:0; right:0; bottom:0; height:30%;
    background:rgba(0,0,0,.85);
    display:flex; align-items:center; justify-content:center; padding:2px 4px;
  }
  .card-front .name{
    font-family:Georgia, serif; font-weight:700; font-size:11px; line-height:1.15;
    color:#FFFFFF; text-shadow:1px 1px 0 #1A1A1A;
  }
  .card-front .polarity-tag{
    position:absolute; top:4px; right:4px; font-size:8px; letter-spacing:.5px;
    text-transform:uppercase; color:var(--hi); background:rgba(0,0,0,.4);
    padding:1px 4px; border-radius:4px;
  }
  .card.flipped .card-front{ animation:glowPulse 2.2s ease-in-out infinite; }
  .card.flipped .card-front::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:repeating-conic-gradient(#000 0% 25%, transparent 0% 50%);
    background-size:8px 8px;
    animation:ditherFade .5s steps(5) forwards;
  }
  @keyframes ditherFade{ from{opacity:.85;} to{opacity:0;} }
  @keyframes breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  @keyframes glowPulse{
    0%,100%{ box-shadow:inset 0 0 0 1px var(--hi), inset 0 0 0 3px var(--sh), 0 6px 18px rgba(0,0,0,.45); }
    50%{ box-shadow:inset 0 0 0 1px var(--hi), inset 0 0 0 3px var(--sh), 0 0 16px 2px var(--p2), 0 6px 18px rgba(0,0,0,.45); }
  }
  .empty-slot{
    width:100%; height:100%; border-radius:10px;
    border:1.5px dashed rgba(217,184,108,.3);
  }
  .card.locked{opacity:.35; pointer-events:none;}
  .spread-desc{font-size:11px; color:var(--ink-dim); text-align:center; max-width:420px; margin:0 0 14px;}
  .row-block{width:100%; display:flex; flex-direction:column; align-items:center; margin-bottom:14px;}
  .row-header{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:8px; opacity:.85;}
  .row-cards{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .choice-panel{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin:6px 0 16px; padding:14px; border:1px dashed rgba(217,184,108,.4); border-radius:12px;
    max-width:420px;
  }
  .choice-panel p{margin:0; font-size:12px; color:var(--ink-dim); text-align:center;}
  .choice-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .choice-btn{
    background:linear-gradient(160deg, rgba(217,184,108,.2), rgba(217,184,108,.05));
    border:1px solid rgba(217,184,108,.45); color:var(--gold-soft);
    padding:10px 16px; border-radius:18px; font-size:13px; touch-action:manipulation; cursor:pointer;
  }
  .reading-info{
    width:100%; max-width:520px;
    display:flex; flex-direction:column; gap:10px;
  }
  .card-detail{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(217,184,108,.25);
    border-left:4px solid var(--p2, rgba(217,184,108,.6));
    border-radius:12px; padding:12px 14px;
  }
  .card-detail h3{
    margin:0 0 4px; font-family:Georgia, serif; font-size:15px; color:var(--gold-soft);
    display:flex; align-items:center; gap:6px;
  }
  .card-detail .orient{font-size:10px; padding:2px 7px; border-radius:8px; background:rgba(217,184,108,.2); color:var(--gold-soft); text-transform:uppercase;}
  .card-detail .orient.rev{background:rgba(224,95,95,.25); color:#f3b8b8;}
  .card-detail .meaning{font-size:13px; color:var(--ink-dim); line-height:1.5; margin:0;}
  .card-detail .suitline{font-size:11px; color:#8a7ab8; margin-top:4px;}
  .hint{font-size:12px; color:var(--ink-dim); text-align:center; margin:14px 0;}
  .actions{
    display:flex; gap:10px; justify-content:center; margin:16px 0 4px; flex-wrap:wrap;
  }
  .btn{
    background:var(--gold); color:#2b1a05; border:none;
    padding:12px 22px; border-radius:24px; font-size:14px; font-weight:600;
    touch-action:manipulation; cursor:pointer;
  }
  .btn.secondary{
    background:none; border:1px solid rgba(217,184,108,.4); color:var(--gold-soft);
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,4,25,.85);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    width:100%; max-width:560px; max-height:80vh; overflow-y:auto;
    background:var(--bg-2); border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(217,184,108,.4);
  }
  .modal h2{margin:0 0 12px; font-family:Georgia, serif; color:var(--gold-soft); font-size:17px;}
  .history-item{
    border-bottom:1px solid rgba(255,255,255,.08); padding:10px 0; font-size:13px;
  }
  .history-item .h-date{color:var(--ink-dim); font-size:11px;}
  .history-item .h-cards{color:var(--gold-soft); margin-top:2px;}
  .modal .close-btn{float:right; background:none; border:none; color:var(--ink-dim); font-size:18px; cursor:pointer;}
  .empty-history{color:var(--ink-dim); font-size:13px; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="historyBtn" aria-label="Histórico">☰</button>
    <h1>✦ Oráculo das 52 Lâminas ✦</h1>
    <p>Formule sua pergunta em silêncio, depois escolha a tiragem</p>
  </header>

  <main>
    <div class="spreads" id="spreadPicker"></div>
    <div class="spread-desc" id="spreadDesc"></div>
    <div id="board"></div>
    <div id="choicePanel"></div>
    <div class="reading-info" id="readingInfo"></div>
    <div class="hint" id="hint">Toque nas cartas para revelá-las</div>
    <div class="actions">
      <button class="btn" id="newReadingBtn">Nova leitura</button>
    </div>
  </main>
</div>

<div class="modal-overlay" id="historyOverlay">
  <div class="modal">
    <button class="close-btn" id="closeHistory">✕</button>
    <h2>Histórico de leituras</h2>
    <div id="historyList"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Numeral romano (0 fica "0"; tarot não tem zero romano) ---------- */
  function toRoman(n){
    if(n === 0) return "0";
    var map = [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
    var out = "";
    map.forEach(function(pair){
      while(n >= pair[0]){ out += pair[1]; n -= pair[0]; }
    });
    return out;
  }

  /* ---------- Deck data: baralho autoral de 52 cartas ---------- */

  // Parte I — Arcanos Maiores (22 cartas, sem posição invertida)
  var MAJOR = [
    ["O Errante","O salto de fé rumo ao desconhecido, sem bagagens ou medos. A liberdade absoluta de quem confia na própria jornada.","Indica um momento de arriscar, iniciar algo totalmente novo e abandonar a necessidade de controle. Pede espontaneidade e coragem para ser autêntico."],
    ["O Alquimista","O poder da manifestação. Aquele que domina os elementos ao seu redor e transforma ideias intangíveis em realidade material.","Mostra que você possui todos os recursos, contatos e habilidades necessárias para resolver o problema. Aja com foco e determinação."],
    ["O Oráculo","A intuição pura e os mistérios ocultos. A voz silenciosa do subconsciente que guarda sabedorias ancestrais.","O momento não exige ação física, mas escuta interior. Segredos podem ser revelados. Confie em seus pressentimentos e preste atenção aos sonhos."],
    ["A Matriz","A fonte criadora, a fertilidade e a abundância. A energia acolhedora que nutre e dá vida a tudo que toca.","Sinaliza crescimento, prosperidade, gravidez (física ou de projetos) e uma fase de grande força criativa. Conecte-se com a natureza e com o prazer de viver."],
    ["O Arquiteto","A autoridade que traz ordem ao caos. A força estrutural que estabelece limites, regras e fundações duradouras.","Pede organização, disciplina e liderança. É hora de agir com razão, assumir o controle da situação e não ceder a chantagens emocionais."],
    ["O Mentor","A tradição, a ética e a ponte entre o humano e o divino. O conhecimento estruturado passado através de gerações.","Busque aconselhamento com alguém mais experiente ou siga os métodos tradicionais. Indica também instituições, cursos acadêmicos e compromissos formais."],
    ["O Pacto","O alinhamento profundo de valores. As encruzilhadas da vida que exigem escolhas morais e uniões verdadeiras.","Um momento de decisão importante que deve ser feita com o coração, não apenas com a lógica. Pode indicar grandes parcerias, sociedades ou o encontro de um amor genuíno."],
    ["O Conquistador","O domínio sobre os próprios instintos conflitantes para avançar com determinação em uma única direção.","Movimento rápido, viagens ou a superação de obstáculos através da pura força de vontade e foco implacável. Você está no controle e a vitória é certa se não desviar a rota."],
    ["O Domínio","A coragem compassiva. A capacidade de domar as \"feras\" interiores e exteriores não com brutalidade, mas com amor e firmeza.","Pede paciência, resiliência e persuasão. Enfrente seus medos ou uma pessoa difícil usando a doçura e a diplomacia, controlando seus impulsos nervosos."],
    ["O Buscador","A jornada solitária para dentro. O uso da própria luz como farol para encontrar respostas longe do barulho do mundo.","Necessidade vital de isolamento, reflexão e autopreservação. Não tome decisões apressadas; afaste-se temporariamente para enxergar o quadro geral."],
    ["O Ciclo","A roda inescapável do destino. A impermanência da vida, onde altos e baixos se alternam continuamente.","Mudanças inesperadas (frequentemente positivas, de \"sorte\") estão a caminho. Aceite que algumas coisas estão fora do seu controle e adapte-se ao movimento do universo."],
    ["A Balança","A verdade nua e crua que corta ilusões. A lei universal de causa e efeito, onde cada ação encontra sua justa reação.","Assuntos legais, assinaturas de contratos e necessidade de imparcialidade. Você colherá exatamente o que plantou. Seja ético e exija justiça."],
    ["A Suspensão","O sacrifício voluntário e a iluminação alcançada ao olhar o mundo por um ângulo invertido e desconfortável.","Situações estagnadas. Pare de forçar as coisas a acontecerem. Aceite a pausa obrigatória, mude sua perspectiva e faça concessões para destravar a energia."],
    ["A Passagem","A transformação profunda e a transição inescapável. A morte de velhas formas para adubar o terreno do novo.","Finais definitivos e cortes radicais (um emprego, um relacionamento, um hábito). Aceite o luto e o desapego, pois esta limpeza é essencial para sua renovação."],
    ["A Síntese","O equilíbrio alquímico. A mistura harmoniosa de opostos e a paciência para deixar o tempo agir como agente curador.","Pede moderação, meio-termo e calma. Não vá a extremos. Bom presságio para a saúde, harmonização de conflitos e reconciliações."],
    ["As Correntes","O reino das sombras, dos desejos densos, da sexualidade, dos vícios e das ilusões de aprisionamento.","Alerta para relações tóxicas, obsessões, ambição desmedida ou dependências emocionais/financeiras. Lembre-se: as correntes estão soltas, você só está preso pelo próprio medo ou comodismo."],
    ["O Colapso","O raio que destrói as fundações falsas. A crise inevitável que liberta a verdade aprisionada pelo orgulho.","Ruptura repentina de estruturas que já não serviam (divórcios repentinos, demissões, quebra de paradigmas). O choque é doloroso, mas traz libertação total."],
    ["A Aurora","A luz da esperança brilhando após a tempestade. A renovação da fé, a inspiração celestial e a pura cura espiritual.","Um momento de grande proteção cósmica, alívio e otimismo. Deixe sua luz brilhar, invista em seus talentos e acredite no futuro. O pior já passou."],
    ["O Labirinto","As águas profundas do inconsciente. O reino dos medos, das projeções, das paranoias e das emoções flutuantes.","Cuidado com ilusões, fofocas, traições ou autoenganos. As coisas não são o que parecem. Enfrente suas inseguranças e não deixe a ansiedade guiar seus passos."],
    ["O Zênite","O triunfo absoluto da luz. A clareza, a vitalidade inesgotável, a alegria de viver e o sucesso radiante.","Excelente presságio. Confirmação de vitória, resolução de todos os problemas, saúde plena, energia infantil e sucesso público. Diga \"sim\" para a vida."],
    ["O Chamado","O soar da trombeta para uma nova consciência. O momento de autoavaliação final, o despertar e a absolvição.","Uma vocação se apresenta. Perdoe os erros do passado (seus e dos outros) e abrace uma nova chance. Retorno de pessoas ou situações para um encerramento definitivo."],
    ["O Cosmos","A totalidade, a integração do microcosmo com o macrocosmo e a conclusão gloriosa da longa jornada da alma.","O ápice da realização. Projetos concluídos com sucesso, viagens internacionais, expansão de limites e a sensação de estar exatamente onde deveria estar."]
  ].map(function(a, i){
    return {name:a[0], group:"Arcano Maior", groupTheme:null, cat:"major", numeral:toRoman(i), number:i, text:a[1] + " — " + a[2], special:false};
  });

  // Parte II — Arcanos Menores: 4 elementos x 7 graus (28 cartas, sem posição invertida)
  var ELEMENTS = [
    {
      key:"agua", name:"Água", theme:"Emoção, Relacionamentos, Intuição",
      graus:[
        ["O Vínculo","O nascimento do afeto e da atração.","Indica o início de um romance, uma nova amizade ou uma reconciliação promissora. Abra-se para a troca emocional."],
        ["O Oásis","O equilíbrio entre a festa e o retiro.","Comemore as pequenas vitórias com quem você ama, mas saiba quando se afastar para recarregar as energias emocionais."],
        ["A Saudade","O bálsamo das memórias curando a dor da perda.","Resgate a pureza do passado para curar tristezas presentes. O retorno de alguém antigo, ou a necessidade de perdoar uma decepção emocional."],
        ["A Miragem","A intuição rompendo as ilusões reconfortantes.","Abandone um sonho que não tem base na realidade. Hora de deixar para trás uma relação ou ambiente que não preenche mais a sua alma."],
        ["A Plenitude","O ápice da harmonia familiar e emocional.","Alegria duradoura, paz no lar e desejos profundos do coração sendo atendidos. Você chegou a um estado de contentamento absoluto."],
        ["O Sonhador","O impulso romântico, sensível e idealista.","Uma pessoa amorosa e poética (ou essa energia em você). Siga a sua intuição, faça uma declaração, ou dedique-se a uma expressão artística."],
        ["O Guardião das Marés","A maestria emocional, o conselheiro profundo.","Exerça a empatia e o acolhimento sem se perder nas emoções dos outros. Indica maturidade nos relacionamentos e capacidade de curar as próprias feridas."]
      ]
    },
    {
      key:"fogo", name:"Fogo", theme:"Ação, Criatividade, Vontade",
      graus:[
        ["A Centelha","A ideia inicial, o planejamento e o ímpeto de mudar.","É o momento de dar o primeiro passo e sair da zona de conforto. Você tem o plano; agora precisa ter a ousadia de executá-lo."],
        ["A Fogueira","A primeira expansão, o calor do apoio mútuo.","Indica boas parcerias, consolidação de um projeto e a chegada de bons resultados. Você está em um ambiente que incentiva e celebra o seu crescimento."],
        ["A Forja","O atrito das competições lapidando o metal da vontade.","Haverá conflitos, oposição ou disputas de ego. Mantenha-se confiante; os desafios trarão reconhecimento público e vitória se você não recuar."],
        ["O Ímpeto","A energia acelerada e a defesa inabalável do próprio espaço.","As coisas acontecerão muito rápido. Comunique-se com clareza, defenda suas posições e aproveite o momento para resolver pendências com velocidade."],
        ["A Brasa","A resistência sob pressão extrema, carregando fardos.","Você está sobrecarregado, mas muito perto da linha de chegada. Aguente firme, mas delegue responsabilidades assim que o ciclo terminar."],
        ["O Desbravador","O pioneiro enérgico, impaciente e passional.","Aja com coragem, entusiasmo e espírito de aventura. Uma viagem inesperada, uma mudança de rota ou uma atitude ousada trará excelentes resultados."],
        ["O Soberano da Chama","A liderança magnética, o poder de inspiração.","Assuma o comando. Use o seu carisma e a sua autoconfiança para mobilizar pessoas. Seja a figura de autoridade visionária e generosa da situação."]
      ]
    },
    {
      key:"terra", name:"Terra", theme:"Matéria, Segurança, Concretização",
      graus:[
        ["A Semente","O surgimento do recurso material aliado ao malabarismo diário.","Uma nova oportunidade de ganhos está disponível, mas exigirá adaptação, jogo de cintura e flexibilidade na gestão do tempo ou dinheiro."],
        ["O Alicerce","A edificação cautelosa e a união de competências técnicas.","Trabalhe em equipe para construir algo sólido. Cuidado com a avareza; proteja seus bens, mas não paralise o fluxo financeiro pelo medo de perder."],
        ["A Providência","O balanço da balança material: escassez e ajuda.","Se estiver em dificuldade, engula o orgulho e peça socorro (um empréstimo, um favor). Se estiver próspero, seja generoso e retribua as bênçãos ao mundo."],
        ["O Ofício","A repetição metódica, o foco nos detalhes e na produção.","Concentre-se no trabalho e nos estudos práticos. Aprimore suas habilidades. O sucesso chegará não por sorte, mas pelo esforço diário contínuo e bem feito."],
        ["O Legado","O conforto definitivo, a herança e o patrimônio acumulado.","Desfrute do conforto material, da aposentadoria ou dos lucros de um longo esforço. Indica segurança estrutural, enriquecimento e fortes bases familiares."],
        ["O Construtor","O avanço pragmático, teimoso e eficiente.","Não procure atalhos. Faça o que precisa ser feito com método, lealdade e perseverança. Cada passo pragmático pavimentará um caminho duradouro."],
        ["O Soberano da Terra","A abundância instintiva, o provedor rico e próspero.","Aja com visão administrativa e pragmatismo, garantindo o conforto, a saúde física e o sucesso financeiro. Administre seus recursos visando luxo e qualidade."]
      ]
    },
    {
      key:"ar", name:"Ar", theme:"Mente, Verdade, Conflito",
      graus:[
        ["A Lucidez","O \"insight\" cortante que resolve impasses.","Tire as vendas. Use o intelecto frio para tomar a decisão que está sendo evitada. Uma conversa franca, lógica e direta resolverá a questão pendente."],
        ["A Trégua","O descanso estratégico da mente, a pausa obrigatória para cura.","Pare de pensar excessivamente no problema. Você precisa descansar, meditar ou dormir para cicatrizar uma dor antes de voltar para a vida agitada."],
        ["A Travessia","O abandono de vitórias inúteis em busca de paz.","Afaste-se da confusão. Aceite a perda, perdoe o agravante e mude fisicamente ou mentalmente de cenário. A paz é mais importante que estar certo."],
        ["A Armadilha","As prisões criadas pelas crenças limitantes e pela ansiedade.","Você está refém dos seus próprios pensamentos. Pare de criar obstáculos imaginários. A saída é simples: encare o problema de frente e liberte-se."],
        ["O Abismo","O fim inescapável da negação, o colapso dos esquemas mentais.","Aceite o pior cenário, chore, desabafe. A resistência só prolonga a dor mental. Quando você aceita o fundo do poço, a mente desocupa espaço e o renascimento começa."],
        ["O Desafiante","A mente inquiridora, o discurso cortante, a pressa em debater.","Exija fatos e verdades. Esteja pronto para argumentar e cortar a manipulação alheia pela raiz. Cuidado apenas para não se tornar excessivamente agressivo ou frio."],
        ["O Soberano do Ar","A imparcialidade suprema do intelecto refinado, o estratega.","Adote uma postura distanciada e analítica. Julgue a situação de forma ética, clara e sem sentimentalismos. Suas palavras têm o poder de sentenciar o futuro."]
      ]
    }
  ];

  var MINOR = [];
  ELEMENTS.forEach(function(el){
    el.graus.forEach(function(g, idx){
      MINOR.push({
        name: g[0],
        group: "Elemento " + el.name,
        groupTheme: el.theme,
        cat: el.key,
        numeral: toRoman(idx + 1),
        grau: idx + 1,
        text: g[1] + " — " + g[2],
        special:false
      });
    });
  });

  // Parte III — Cartas Especiais (2 cartas, dualidade Luz/Sombra em vez de invertida)
  var SPECIAL = [
    {
      name:"A Paixão",
      group:"Carta Especial",
      groupTheme:null,
      cat:"special",
      numeral:null,
      description:"O magnetismo, o desejo absoluto e a necessidade de fusão.",
      light:"O amor que devota, fortalece e gera milagres. A conexão íntima curadora, o carisma magnético. A força de dar a própria vida por algo sagrado.",
      dark:"O ciúme possessivo, o apego tóxico e o vazio existencial. A obsessão, a chantagem emocional e a atração perigosa por algo que consumirá sua energia.",
      special:true
    },
    {
      name:"A Ambição",
      group:"Carta Especial",
      groupTheme:null,
      cat:"special",
      numeral:null,
      description:"O instinto de ascensão, o orgulho e a fome de poder.",
      light:"A superação admirável de limites, o ímpeto de vencer a miséria ou o ostracismo. A liderança que inspira e ergue os oprimidos, construindo um grande legado.",
      dark:"A ganância insaciável, a tirania, e a política do \"os fins justificam os meios\". O ego que pisa nos outros e acaba governando, solitário, um império de cinzas.",
      special:true
    }
  ];

  var DECK = MAJOR.concat(MINOR).concat(SPECIAL); // 22 + 28 + 2 = 52

  /* ---------- Glifos de canto por categoria (12x12, currentColor) ---------- */
  var CORNER_GLYPH = {
    major: '<svg viewBox="0 0 12 12"><rect x="4" y="0" width="4" height="12" fill="currentColor"/><rect x="0" y="4" width="12" height="4" fill="currentColor"/><rect x="1.8" y="1.8" width="8.4" height="8.4" fill="currentColor" transform="rotate(45 6 6)"/></svg>',
    agua: '<svg viewBox="0 0 12 12"><path d="M6 0C9 4 11 7 11 9a5 5 0 0 1-10 0C1 7 3 4 6 0Z" fill="currentColor"/></svg>',
    fogo: '<svg viewBox="0 0 12 12"><path d="M6 0c1.6 2.6 3.6 4 3.6 6.6A3.6 3.6 0 0 1 6 10.2a3.6 3.6 0 0 1-3.6-3.6c0-1 .4-1.7.9-2.4C3.6 5 4.4 5.8 5 5.6 4.3 3.8 4.6 1.8 6 0Z" fill="currentColor"/></svg>',
    terra: '<svg viewBox="0 0 12 12"><polygon points="6,0 12,6 6,12 0,6" fill="currentColor"/></svg>',
    ar: '<svg viewBox="0 0 12 12"><path d="M6 6c0-2.2 2.2-3.3 3.2-1.6S8.2 8.6 6 8.6 2.3 6.2 2.8 4 6 1 8.2 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    special: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M6 1a5 5 0 0 1 0 10Z" fill="#050505"/></svg>'
  };

  /* ---------- Verso das cartas: astrolábio 16-bit (mesmo para todo o baralho) ---------- */
  function buildBackSVG(){
    var ticks = "";
    for(var i = 0; i < 12; i++){
      var angle = (i * 30) * Math.PI / 180;
      var x1 = 50 + 40 * Math.sin(angle), y1 = 50 - 40 * Math.cos(angle);
      var x2 = 50 + 45 * Math.sin(angle), y2 = 50 - 45 * Math.cos(angle);
      ticks += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#D4AF37" stroke-width="1.6"/>';
    }
    var stars = "";
    var starPos = [[8,10],[22,18],[85,12],[92,30],[12,70],[6,45],[88,68],[78,88],[35,92],[60,90],[15,25],[70,20]];
    starPos.forEach(function(p, idx){
      var r = idx % 3 === 0 ? 1.2 : 0.7;
      var c = idx % 4 === 0 ? "#BEE9E8" : "#FFFFFF";
      stars += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '" fill="' + c + '"/>';
    });
    return '<svg viewBox="0 0 100 100">' +
      stars +
      '<circle cx="50" cy="50" r="45" fill="none" stroke="#8A6818" stroke-width="1.5"/>' +
      ticks +
      '<circle cx="50" cy="50" r="30" fill="none" stroke="#D4AF37" stroke-width="1"/>' +
      '<circle cx="50" cy="50" r="18" fill="#453205" stroke="#D4AF37" stroke-width="1.5"/>' +
      '<path d="M50 34a16 16 0 0 1 0 32 12 12 0 0 0 0-32Z" fill="#F7D070"/>' +
      '<circle cx="50" cy="50" r="3" fill="#080D1A"/>' +
    '</svg>';
  }
  var BACK_SVG = buildBackSVG();

  /* ---------- Spreads: números primos ≤ 7, Lei das Fileiras ----------
     Meio = Presente (aberta 1ª) · Baixo = Passado (aberta 2ª) · Cima = Futuro (aberta 3ª)
     A tiragem de Grau 2 é ramificada: a 2ª carta desce (Causa) ou sobe (Consequência). */
  var SPREADS = [
    {
      id:"g2", num:2, label:"Grau 2 · Causa ou Consequência",
      desc:"Resposta binária para urgências. Depois de ver o Presente, escolha investigar a Causa ou prever a Consequência.",
      branch:true,
      meio:[{label:"Situação Atual"}]
    },
    {
      id:"g3", num:3, label:"Grau 3 · Linha do Tempo Direta",
      desc:"Estrutura equilibrada e analítica: o agora, a raiz e a colheita.",
      branch:false,
      meio:[{label:"O status do agora"}],
      baixo:[{label:"A raiz da questão"}],
      cima:[{label:"A colheita que está chegando"}]
    },
    {
      id:"g5", num:5, label:"Grau 5 · Ponto de Pressão",
      desc:"Cruz horizontal com foco analítico massivo no presente.",
      branch:false,
      meio:[{label:"Situação aparente"},{label:"Obstáculo oculto"},{label:"Atitude mental"}],
      baixo:[{label:"O gatilho original"}],
      cima:[{label:"O veredito, se nada mudar"}]
    },
    {
      id:"g7", num:7, label:"Grau 7 · A Teia do Destino",
      desc:"A leitura máxima: um diamante 2-3-2 para cruzamento denso de dados.",
      branch:false,
      meio:[{label:"Corpo / Vida Material"},{label:"Mente / Estado Emocional"},{label:"Alma / Essência da Questão"}],
      baixo:[{label:"A Herança"},{label:"O Fantasma"}],
      cima:[{label:"A Luz"},{label:"A Escuridão"}]
    }
  ];

  var ROW_TITLE = {meio:"Presente", baixo:"Passado", cima:"Futuro"};
  var ROW_ORDER = ["cima","meio","baixo"]; // ordem visual: futuro em cima, presente no meio, passado embaixo

  /* ---------- State ---------- */
  var state = {
    spread: SPREADS[1],
    rows: {meio:[], baixo:[], cima:[]},
    pendingSecond: null,
    choiceMade: null
  };

  /* ---------- Helpers ---------- */
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function makeDrawn(card, pos){
    return {
      pos: pos,
      card: card,
      polarity: card.special ? (Math.random() < 0.5 ? "luz" : "escuridao") : null,
      revealed: false
    };
  }

  function totalCount(spread){
    if(spread.branch) return 2;
    return spread.meio.length + spread.baixo.length + spread.cima.length;
  }

  function drawNewReading(spread){
    var pool = shuffle(DECK);
    var cards = pool.slice(0, totalCount(spread));
    var i = 0;

    state.spread = spread;
    state.rows = {meio:[], baixo:[], cima:[]};
    state.pendingSecond = null;
    state.choiceMade = null;

    spread.meio.forEach(function(pos){ state.rows.meio.push(makeDrawn(cards[i], pos)); i++; });

    if(spread.branch){
      state.pendingSecond = cards[i];
    }else{
      spread.baixo.forEach(function(pos){ state.rows.baixo.push(makeDrawn(cards[i], pos)); i++; });
      spread.cima.forEach(function(pos){ state.rows.cima.push(makeDrawn(cards[i], pos)); i++; });
    }
    render();
  }

  function rowEntries(rowName){ return state.rows[rowName]; }

  function rowRevealed(rowName){
    var entries = rowEntries(rowName);
    return entries.length > 0 && entries.every(function(d){ return d.revealed; });
  }

  function rowUnlocked(rowName){
    if(rowName === "meio") return true;
    if(state.spread.branch){
      if(rowName === "baixo") return state.choiceMade === "causa";
      if(rowName === "cima") return state.choiceMade === "consequencia";
    }
    if(rowName === "baixo") return rowRevealed("meio");
    if(rowName === "cima") return rowRevealed("meio") && rowRevealed("baixo");
    return false;
  }

  function allRevealed(){
    return ["meio","baixo","cima"].every(function(r){
      var entries = rowEntries(r);
      return entries.every(function(d){ return d.revealed; });
    });
  }

  function makeChoice(kind){
    var pos = kind === "causa" ? {label:"A Causa"} : {label:"A Consequência"};
    var row = kind === "causa" ? "baixo" : "cima";
    state.choiceMade = kind;
    state.rows[row].push(makeDrawn(state.pendingSecond, pos));
    state.pendingSecond = null;
    render();
  }

  function cardMeaning(d){
    if(d.card.special){
      return d.polarity === "escuridao" ? d.card.dark : d.card.light;
    }
    return d.card.text;
  }

  function saveToHistory(){
    try{
      var list = JSON.parse(localStorage.getItem("tarot_history") || "[]");
      var cards = [];
      ["meio","baixo","cima"].forEach(function(r){
        state.rows[r].forEach(function(d){
          cards.push(d.pos.label + ": " + d.card.name + (d.polarity ? " (" + (d.polarity === "escuridao" ? "Escuridão" : "Luz") + ")" : ""));
        });
      });
      list.unshift({ date: new Date().toISOString(), spread: state.spread.label, cards: cards });
      list = list.slice(0, 30);
      localStorage.setItem("tarot_history", JSON.stringify(list));
    }catch(e){ /* localStorage indisponível: ignora silenciosamente */ }
  }

  /* ---------- Render ---------- */
  var boardEl = document.getElementById("board");
  var spreadPickerEl = document.getElementById("spreadPicker");
  var spreadDescEl = document.getElementById("spreadDesc");
  var choicePanelEl = document.getElementById("choicePanel");
  var infoEl = document.getElementById("readingInfo");
  var hintEl = document.getElementById("hint");

  function renderSpreadPicker(){
    spreadPickerEl.innerHTML = "";
    SPREADS.forEach(function(s){
      var btn = document.createElement("button");
      btn.className = "spread-btn" + (s.id === state.spread.id ? " active" : "");
      btn.textContent = s.label;
      btn.onclick = function(){ drawNewReading(s); };
      spreadPickerEl.appendChild(btn);
    });
    spreadDescEl.textContent = state.spread.desc;
  }

  function makeCardEl(d, rowName){
    var unlocked = rowUnlocked(rowName);
    var isEscuridao = d.polarity === "escuridao";
    var slot = document.createElement("div");
    slot.className = "slot";

    var label = document.createElement("div");
    label.className = "slot-label";
    label.textContent = d.pos.label;
    slot.appendChild(label);

    var glyph = CORNER_GLYPH[d.card.cat] || CORNER_GLYPH.major;
    var cardEl = document.createElement("div");
    cardEl.className = "card" + (d.revealed ? " flipped" : "") + (unlocked ? "" : " locked");
    cardEl.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-back">' +
          '<div class="nebula"></div>' + BACK_SVG +
        '</div>' +
        '<div class="card-face card-front cat-' + d.card.cat + '">' +
          '<span class="glyph tl">' + glyph + '</span>' +
          '<span class="glyph br">' + glyph + '</span>' +
          (d.card.numeral ? '<div class="numeral">' + d.card.numeral + '</div>' : '') +
          (d.polarity ? '<div class="polarity-tag">' + (isEscuridao ? "Escuridão" : "Luz") + '</div>' : '') +
          '<div class="footer"><div class="name">' + d.card.name + '</div></div>' +
        '</div>' +
      '</div>';
    cardEl.onclick = function(){
      if(unlocked && !d.revealed){
        d.revealed = true;
        render();
        if(allRevealed()) saveToHistory();
      }
    };
    slot.appendChild(cardEl);
    return slot;
  }

  function renderBoard(){
    boardEl.innerHTML = "";
    ROW_ORDER.forEach(function(rowName){
      var entries = rowEntries(rowName);
      if(entries.length === 0) return;
      var block = document.createElement("div");
      block.className = "row-block";
      var header = document.createElement("div");
      header.className = "row-header";
      header.textContent = ROW_TITLE[rowName];
      block.appendChild(header);
      var cardsWrap = document.createElement("div");
      cardsWrap.className = "row-cards";
      entries.forEach(function(d){ cardsWrap.appendChild(makeCardEl(d, rowName)); });
      block.appendChild(cardsWrap);
      boardEl.appendChild(block);
    });
  }

  function renderChoicePanel(){
    choicePanelEl.innerHTML = "";
    if(!state.spread.branch) return;
    if(!rowRevealed("meio") || state.choiceMade) return;
    var panel = document.createElement("div");
    panel.className = "choice-panel";
    panel.innerHTML = '<p>O cartomante decide: investigar o Passado (Causa) ou prever o Futuro (Consequência)?</p>';
    var row = document.createElement("div");
    row.className = "choice-row";
    var causaBtn = document.createElement("button");
    causaBtn.className = "choice-btn";
    causaBtn.textContent = "Por quê — A Causa";
    causaBtn.onclick = function(){ makeChoice("causa"); };
    var consBtn = document.createElement("button");
    consBtn.className = "choice-btn";
    consBtn.textContent = "Para onde — A Consequência";
    consBtn.onclick = function(){ makeChoice("consequencia"); };
    row.appendChild(causaBtn);
    row.appendChild(consBtn);
    panel.appendChild(row);
    choicePanelEl.appendChild(panel);
  }

  function renderInfo(){
    infoEl.innerHTML = "";
    var any = false;
    ["meio","baixo","cima"].forEach(function(rowName){
      rowEntries(rowName).forEach(function(d){
        if(!d.revealed) return;
        any = true;
        var isEscuridao = d.polarity === "escuridao";
        var box = document.createElement("div");
        box.className = "card-detail cat-" + d.card.cat;
        box.innerHTML =
          '<h3>' + d.card.name +
            (d.polarity ? '<span class="orient' + (isEscuridao ? " rev" : "") + '">' + (isEscuridao ? "Escuridão" : "Luz") + '</span>' : '') +
          '</h3>' +
          '<p class="meaning"><strong>' + ROW_TITLE[rowName] + ' — ' + d.pos.label + ':</strong> ' + cardMeaning(d) + '</p>' +
          (d.card.groupTheme ? '<div class="suitline">' + d.card.group + ' — ' + d.card.groupTheme + '</div>' : '');
        infoEl.appendChild(box);
      });
    });
    var msg = null;
    if(!rowRevealed("meio")){
      msg = any ? "Abra as demais cartas do Presente antes de seguir." : "Comece abrindo a fileira do Presente.";
    }else if(state.spread.branch && !state.choiceMade){
      msg = null; // painel de escolha já orienta o próximo passo
    }else if(rowEntries("baixo").length && !rowRevealed("baixo")){
      msg = "Agora abra a fileira do Passado.";
    }else if(rowEntries("cima").length && !rowRevealed("cima")){
      msg = "Por fim, abra a fileira do Futuro.";
    }
    hintEl.style.display = msg ? "block" : "none";
    if(msg) hintEl.textContent = msg;
  }

  function render(){
    renderSpreadPicker();
    renderBoard();
    renderChoicePanel();
    renderInfo();
  }

  /* ---------- History modal ---------- */
  var overlay = document.getElementById("historyOverlay");
  var historyList = document.getElementById("historyList");

  function renderHistory(){
    var list = [];
    try{ list = JSON.parse(localStorage.getItem("tarot_history") || "[]"); }catch(e){}
    if(list.length === 0){
      historyList.innerHTML = '<div class="empty-history">Nenhuma leitura salva ainda.</div>';
      return;
    }
    historyList.innerHTML = list.map(function(item){
      var d = new Date(item.date);
      var dateStr = d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
      return '<div class="history-item">' +
        '<div class="h-date">' + dateStr + ' · ' + item.spread + '</div>' +
        '<div class="h-cards">' + item.cards.join(" · ") + '</div>' +
      '</div>';
    }).join("");
  }

  document.getElementById("historyBtn").onclick = function(){
    renderHistory();
    overlay.classList.add("open");
  };
  document.getElementById("closeHistory").onclick = function(){
    overlay.classList.remove("open");
  };
  overlay.onclick = function(e){
    if(e.target === overlay) overlay.classList.remove("open");
  };

  document.getElementById("newReadingBtn").onclick = function(){
    drawNewReading(state.spread);
  };

  /* ---------- Init ---------- */
  drawNewReading(state.spread);
})();
</script>
</body>
</html>
